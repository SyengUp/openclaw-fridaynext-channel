[Service]
# 防白嫖：activate 必须携带可验证的 App Attest 证明（2026-07-28 启用）。
# 未开启时 `/v1/tunnels/activate` 对「不带 attestation」的请求放行并只记一笔 unattested，
# 等于任何人拿到 gatewayKey 就能申领隧道。
#
# 启用前先核 cp-state：确认没有仍在有效期内的 `attested:false` grant，否则会踢掉真实用户。
# 2026-07-28 的实况是 5 个 grant 里唯一活跃者已 attested=true，另三个均已过期且属于
# 已退役的 bootstrap 路径，故零误伤。
#
# 回滚：删除本文件 → systemctl daemon-reload → systemctl restart gw-alloc
Environment=CP_ATTEST_REQUIRE=1

# 是否接受 development 环境的 App Attest 证明（dev 签名 / 重签名构建）。
# 默认 1（接受）。确认 App Store 正式包产出 production 证明后设 0，届时重签名构建
# 无法再申领隧道。注意与 CP_ATTEST_REQUIRE 正交：那个决定「是否必须带证明」，
# 这个决定「哪些环境的证明算数」。
#
# 设 0 会连带挡住 Debug 构建（其 entitlement 为 development）——本机开发时改走局域网。
# Environment=CP_ATTEST_ALLOW_DEV=0
